<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quran Research Directory</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="stylesheet" href="assets/vendor/quill/quill.snow.css" />
<link rel="stylesheet" href="assets/css/style.css" />
<script>
  // Applied before first paint so switching themes never flashes the other theme.
  document.documentElement.setAttribute('data-theme', localStorage.getItem('qrd-theme') || 'dark');
</script>
</head>
<body>
  <div class="topbar">
    <div class="brand" id="brand">
      <span class="brand-ar">القرآن</span>
      <span>Quran Research Directory</span>
    </div>
    <nav class="top-nav">
      <a href="#/">Dashboard</a>
      <a href="#/library">Library</a>
      <a href="#/search">Search</a>
      <a href="#/export">Export</a>
      <a href="#/review">Review</a>
    </nav>
    <div class="topbar-spacer"></div>
    <input class="search-box" id="search-box" type="text" placeholder="Search surahs..." />
    <a class="back-link" id="logout-link" href="#" style="display:none;">Log out</a>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <div id="app"></div>

  <script src="assets/vendor/quill/quill.js"></script>
  <script src="assets/js/quran-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ayah-picker.js"></script>
  <script src="assets/js/editor.js"></script>
  <script src="assets/js/docs.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
